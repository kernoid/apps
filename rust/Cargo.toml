# SPDX-License-Identifier: MIT
# The Rust side of kernoid's apps: what Dart calls through flutter_rust_bridge (`src/api/`), on kernoid's Rust SDK
# (`kernoid-client`, docs/plan.md, 1). A workspace of its own; dependencies are exact (`=`), permissive (`deny.toml`) and
# at least two weeks old when taken.
[workspace]

[package]
name = "kernoid_bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/kernoid/apps"
description = "The Rust side of kernoid's apps: JMAP over HTTPS, called from Dart"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
flutter_rust_bridge = "=2.13.0"
# kernoid's Rust SDK (MIT): JMAP, push, end-to-end encryption (on kernoid-e2e) – from kernoid/kernoid until it is on
# crates.io (docs/plan.md, 1).
kernoid-client = { git = "https://github.com/kernoid/kernoid", rev = "5c64e18e4e7d27a909e83fdbf368e62f753c4e11" }
kernoid-e2e = { git = "https://github.com/kernoid/kernoid", rev = "5c64e18e4e7d27a909e83fdbf368e62f753c4e11" }
# Named only for its feature: prefer the post-quantum key exchange X25519MLKEM768, as kernoid does (RFC 0006, 2).
rustls = { version = "=0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "fs", "io-util"] }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

# OpenPGP's Argon2 and post-quantum keys are slow without optimisation, even in debug builds.
[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
