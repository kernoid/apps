# SPDX-License-Identifier: MIT
# The Rust version the apps build with, as kernoid's (`kernoid/kernoid`, rust-toolchain.toml); the targets of the five
# platforms, so that cargokit finds them installed.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
targets = ["aarch64-apple-darwin", "aarch64-apple-ios", "aarch64-apple-ios-sim", "aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
profile = "minimal"
