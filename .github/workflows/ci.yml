# SPDX-License-Identifier: MIT
# The app on all five platforms at once (docs/plan.md, 2): format and analysis of Dart, and a build for macOS, iOS
# (simulator), Linux, Android and Windows – on kernoid's app kit (RFC 0011) as kernoid/kernoid has it at KERNOID_REF,
# checked out beside the app (scripts/kit.sh); the kit's packages and their Rust side are checked there. Flutter comes
# from its repository at the version named here, Rust from the bridge's rust-toolchain.toml. The licence check (REUSE)
# and the sign-off (DCO) come from falkoss/starterpack, pinned by commit; actions are pinned by commit, with the version
# as a comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.0
  # The kit the app is built on: a branch or a release's tag of kernoid/kernoid.
  KERNOID_REF: main
  KERNOID_DIR: ${{ github.workspace }}/kernoid

jobs:
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kernoid/kernoid
          ref: ${{ env.KERNOID_REF }}
          path: kernoid
      - name: The kit of that checkout
        run: scripts/kit.sh
      - name: Rust toolchain from the bridge's rust-toolchain.toml
        working-directory: kernoid/kit/flutter/kernoid_bridge/rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: kernoid/kit/flutter/kernoid_bridge/rust
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib integration_test
      - run: flutter analyze lib integration_test
      - run: flutter build macos --debug
      - run: flutter build ios --simulator --debug

  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          # Git Bash on Windows runs the batch file, not the shell script.
          if [[ "$RUNNER_OS" == Windows ]]; then echo "FLUTTER=flutter.bat" >> "$GITHUB_ENV"; else echo "FLUTTER=flutter" >> "$GITHUB_ENV"; fi
      - name: Libraries for Linux – GTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kernoid/kernoid
          ref: ${{ env.KERNOID_REF }}
          path: kernoid
      - name: The kit of that checkout
        run: scripts/kit.sh
      - name: Rust toolchain from the bridge's rust-toolchain.toml
        working-directory: kernoid/kit/flutter/kernoid_bridge/rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: kernoid/kit/flutter/kernoid_bridge/rust
      - run: $FLUTTER pub get
      - name: Build
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then "$FLUTTER" build windows --debug; else "$FLUTTER" build linux --debug; fi

  android:
    runs-on: ubuntu-latest
    env:
      # Without debug info the Rust builds of three Android targets fit on the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Room on the disk – tools of the runner the build does not use
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY/CodeQL" && df -h /
      - name: Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kernoid/kernoid
          ref: ${{ env.KERNOID_REF }}
          path: kernoid
      - name: The kit of that checkout
        run: scripts/kit.sh
      - name: Rust toolchain from the bridge's rust-toolchain.toml
        working-directory: kernoid/kit/flutter/kernoid_bridge/rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: kernoid/kit/flutter/kernoid_bridge/rust
      - run: flutter pub get
      # One architecture is enough to see that it builds; four take the runner's time and disk.
      - run: flutter build apk --debug --target-platform android-arm64

  licences:
    uses: falkoss/starterpack/.github/workflows/reuse.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
  sign-off:
    uses: falkoss/starterpack/.github/workflows/dco.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
