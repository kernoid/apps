# SPDX-License-Identifier: MIT
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
    - rust_builder/cargokit/**
    - lib/src/rust/**
    # Generated by `flutter gen-l10n`, which in Flutter 3.50 still names the delegates of flutter_localizations,
    # deprecated since Material and Cupertino became packages of their own.
    - lib/l10n/app_localizations.dart
