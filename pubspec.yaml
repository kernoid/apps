# SPDX-License-Identifier: MIT
# kernoid's app for macOS, iOS, Linux, Android and Windows (docs/plan.md). Dependencies are exact and at least two
# weeks old when taken; the Rust side is in rust/, built by cargokit through the plugin in rust_builder/.
name: kernoid
description: "kernoid on desktops and phones: mail, calendars, contacts and files."
publish_to: 'none'
version: 0.3.0+6

environment:
  sdk: ^3.14.0

dependencies:
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: 11.2.0
  flutter_web_auth_2: 5.1.0
  intl: any
  lucide_icons_flutter: 4.0.0
  kernoid_bridge:
    path: rust_builder
  path_provider: 2.1.6
  flutter_widget_from_html_core: 0.17.4
  url_launcher: 6.3.3
  pdfrx: 2.9.0
  share_plus: 13.3.1
  desktop_drop: 0.8.4
  tray_manager: 0.5.3
  window_manager: 0.5.2
  # Material and Cupertino as packages of their own since Flutter 3.50 (`dart fix --code=migrate_design_widgets`).
  material_ui: 1.8.0
  cupertino_ui: 1.1.4

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

# Platform parts of file_selector, and parts pdfrx brings, set back to their newest versions at least two weeks old
# (CLAUDE.md, Rules).
dependency_overrides:
  archive: 4.5.2
  cupertino_ui: 1.1.4
  file_selector_ios: 0.5.3+6
  file_selector_macos: 0.9.5+1
  material_ui: 1.8.0
  pdfium_dart: 0.4.0
  pdfium_flutter: 0.4.0
  posix: 6.5.2

flutter:
  uses-material-design: true
  generate: true
  # The tray icon on desktops (kernoid/brand, CC BY-ND 4.0).
  assets:
    - assets/tray/
  # kernoid's look: IBM Plex (assets/fonts, OFL-1.1).
  fonts:
    - family: Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
