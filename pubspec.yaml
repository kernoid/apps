# SPDX-License-Identifier: MIT
# kernoid's app for macOS, iOS, Linux, Android and Windows (docs/plan.md). Dependencies are exact and at least two
# weeks old when taken; the Rust side is in rust/, built by cargokit through the plugin in rust_builder/.
name: kernoid
description: "kernoid on desktops and phones: mail, calendars, contacts and files."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.13.7

dependencies:
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: 11.2.0
  flutter_web_auth_2: 5.1.0
  intl: any
  kernoid_bridge:
    path: rust_builder
  path_provider: 2.1.6
  flutter_widget_from_html_core: 0.17.4
  url_launcher: 6.3.3

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

# Platform parts of file_selector set back to their newest versions at least two weeks old (CLAUDE.md, Rules).
dependency_overrides:
  file_selector_ios: 0.5.3+6
  file_selector_macos: 0.9.5+1

flutter:
  uses-material-design: true
  generate: true
