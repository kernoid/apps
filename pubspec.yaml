# SPDX-License-Identifier: MIT
# kernoid's app for macOS, iOS, Linux, Android and Windows (docs/plan.md), put together from kernoid's app kit
# (kit/flutter/ in kernoid/kernoid, RFC 0011) – the Rust side is the kit's package kernoid_bridge. Dependencies are exact
# and at least two weeks old when taken.
name: kernoid
description: "kernoid on desktops and phones: mail, calendars, contacts and files, from kernoid's app kit."
publish_to: 'none'
version: 0.4.1+9

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # kernoid's app kit (RFC 0011), from kernoid/kernoid at the release of the same version; the packages refer to each
  # other by path there, so every one of them is named again below (dependency_overrides). To develop against a
  # checkout beside this one, `scripts/kit.sh` writes a pubspec_overrides.yaml (not tracked).
  kernoid_calendar:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_calendar
  kernoid_contacts:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_contacts
  kernoid_files:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_files
  kernoid_mail:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_mail
  kernoid_shell:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_shell

dev_dependencies:
  flutter_lints: 6.0.0
  # The integration test reaches into the kit and Lucide's icons directly.
  kernoid_bridge: any
  kernoid_l10n: any
  kernoid_ui: any
  lucide_icons_flutter: 4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

# The kit's packages, all from the same release – and platform parts of file_selector and parts pdfrx's engine brings,
# set back to their newest versions at least two weeks old (CLAUDE.md, Rules).
dependency_overrides:
  kernoid_bridge:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_bridge
  kernoid_calendar:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_calendar
  kernoid_contacts:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_contacts
  kernoid_files:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_files
  kernoid_l10n:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_l10n
  kernoid_mail:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_mail
  kernoid_shell:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_shell
  kernoid_ui:
    git:
      url: https://github.com/kernoid/kernoid
      ref: v0.5.0
      path: kit/flutter/kernoid_ui
  archive: 4.5.2
  file_selector_ios: 0.5.3+6
  file_selector_macos: 0.9.5+1
  pdfium_dart: 0.4.0
  pdfium_flutter: 0.4.0
  posix: 6.5.2

flutter:
  uses-material-design: false
  # The tray icon on desktops (kernoid/brand, CC BY-ND 4.0). The fonts come with kernoid_ui.
  assets:
    - assets/tray/
